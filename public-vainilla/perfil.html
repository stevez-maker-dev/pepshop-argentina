<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil - PepShop Argentina</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js" defer></script>
  <script src="js/carrito.js" defer></script>
  <script src="js/perfil.js" defer></script>
</head>
<body>

  <header>
    <h1>PepShop Argentina</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="index.html?especie=Perro">Perros</a></li>
        <li><a href="index.html?especie=Gato">Gatos</a></li>
        <li><a href="carrito.html">Carrito <span class="contador-carrito" id="contador-carrito">0</span></a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="perfil-contenedor">
      <h2>Mi perfil</h2>

      <section class="perfil-seccion">
        <h3>Datos personales</h3>
        <div id="mensaje-nombre" class="mensaje-exito" style="display:none"></div>
        <div class="form-grupo">
          <label for="perfil-nombre">Nombre</label>
          <input type="text" id="perfil-nombre" placeholder="Tu nombre">
        </div>
        <div class="form-grupo">
          <label>Email</label>
          <input type="email" id="perfil-email" disabled>
        </div>
        <div class="form-grupo">
          <label>Rol</label>
          <input type="text" id="perfil-rol" disabled>
        </div>
        <button class="btn-form" id="btn-guardar-nombre">Guardar nombre</button>
      </section>

      <section class="perfil-seccion">
        <h3>Cambiar contraseña</h3>
        <div id="mensaje-password" class="mensaje-exito" style="display:none"></div>
        <div id="error-password" class="mensaje-error" style="display:none"></div>
        <div class="form-grupo">
          <label for="password-actual">Contraseña actual</label>
          <input type="password" id="password-actual" placeholder="Tu contraseña actual">
        </div>
        <div class="form-grupo">
          <label for="password-nueva">Nueva contraseña</label>
          <input type="password" id="password-nueva" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-grupo">
          <label for="password-confirmar">Confirmar nueva contraseña</label>
          <input type="password" id="password-confirmar" placeholder="Repetí la nueva contraseña">
        </div>
        <button class="btn-form" id="btn-cambiar-password">Cambiar contraseña</button>
      </section>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 PepShop Argentina. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
