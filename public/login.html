<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - PepShop Argentina</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js" defer></script>
</head>
<body>

  <header>
    <h1>PepShop Argentina</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="index.html?especie=Perro">Perros</a></li>
        <li><a href="index.html?especie=Gato">Gatos</a></li>
        <li><a href="carrito.html">Carrito <span class="contador-carrito" id="contador-carrito">0</span></a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-contenedor">
      <h2>Iniciar sesión</h2>
      <p class="form-subtitulo">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>

      <div id="mensaje-error" class="mensaje-error" style="display:none"></div>

      <div class="form-grupo">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="tu@email.com">
      </div>
      <div class="form-grupo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña">
      </div>
      <button class="btn-form" id="btn-login">Iniciar sesión</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 PepShop Argentina. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
