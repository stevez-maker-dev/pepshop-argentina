<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración - PepShop Argentina</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body>

  <header>
    <h1>PepShop Argentina</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="index.html?especie=Perro">Perros</a></li>
        <li><a href="index.html?especie=Gato">Gatos</a></li>
        <li><a href="carrito.html">Carrito <span class="contador-carrito" id="contador-carrito">0</span></a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="admin-contenedor">

      <div class="admin-tabs">
        <button class="tab-btn tab-activo" data-tab="productos">Productos</button>
        <button class="tab-btn" data-tab="ordenes">Órdenes</button>
      </div>

      <section id="tab-productos" class="tab-contenido">
        <div class="admin-encabezado">
          <h2>Gestión de productos</h2>
          <button class="btn-nuevo-producto" id="btn-nuevo-producto">+ Nuevo producto</button>
        </div>

        <div id="form-producto" class="form-producto" style="display:none">
          <h3 id="form-producto-titulo">Nuevo producto</h3>
          <input type="hidden" id="producto-id">
          <div class="form-grid">
            <div class="form-grupo">
              <label for="p-nombre">Nombre</label>
              <input type="text" id="p-nombre">
            </div>
            <div class="form-grupo">
              <label for="p-precio">Precio</label>
              <input type="number" id="p-precio" min="0">
            </div>
            <div class="form-grupo">
              <label for="p-especie">Especie</label>
              <select id="p-especie">
                <option value="Perro">Perro</option>
                <option value="Gato">Gato</option>
              </select>
            </div>
            <div class="form-grupo">
              <label for="p-categoria">Categoría</label>
              <select id="p-categoria">
                <option value="Alimento">Alimento</option>
                <option value="Juguete">Juguete</option>
                <option value="Accesorio">Accesorio</option>
                <option value="Higiene">Higiene</option>
                <option value="Salud">Salud</option>
              </select>
            </div>
            <div class="form-grupo">
              <label for="p-stock">Stock</label>
              <input type="number" id="p-stock" min="0">
            </div>
            <div class="form-grupo">
              <label for="p-imagen">URL de imagen</label>
              <input type="text" id="p-imagen">
            </div>
          </div>
          <div class="form-grupo">
            <label for="p-descripcion">Descripción</label>
            <textarea id="p-descripcion" rows="3"></textarea>
          </div>
          <div class="form-acciones">
            <button class="btn-form" id="btn-guardar-producto">Guardar</button>
            <button class="btn-cancelar" id="btn-cancelar-producto">Cancelar</button>
          </div>
        </div>

        <table class="tabla-admin" id="tabla-productos">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Especie</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="tab-ordenes" class="tab-contenido" style="display:none">
        <h2>Órdenes recientes</h2>
        <table class="tabla-admin" id="tabla-ordenes">
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 PepShop Argentina. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
